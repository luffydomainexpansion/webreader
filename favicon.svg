<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Left Page -->
  <path d="M32 46 C26 42 18 42 12 44 L12 20 C18 18 26 18 32 22 Z" fill="url(#pageGrad)"/>
  <!-- Right Page -->
  <path d="M32 46 C38 42 46 42 52 44 L52 20 C46 18 38 18 32 22 Z" fill="url(#pageGrad)"/>
  <!-- Spine Line & Center Fold -->
  <path d="M32 22 L32 47" stroke="url(#bookGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bookmark Ribbon -->
  <path d="M30 14 L34 14 L34 24 L32 22 L30 24 Z" fill="#f59e0b"/>
  <!-- Text lines subtle on pages -->
  <line x1="16" y1="26" x2="27" y2="26" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="32" x2="27" y2="32" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="38" x2="24" y2="38" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>

  <line x1="37" y1="26" x2="48" y2="26" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="37" y1="32" x2="48" y2="32" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="37" y1="38" x2="45" y2="38" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
</svg>
